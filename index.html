<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Web</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="crosshair">+</div>
      <div id="hotbar"></div>
      <div id="info"></div>
      <div id="menu">
        <h1>Minecraft Web</h1>
        <p>Click to play</p>
        <p class="controls">
          WASD move · Space jump · Ctrl sprint · Shift sneak · Mouse look<br />
          Left click break · Right click place · 1-9 / wheel select block<br />
          F fly toggle · Esc pause
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
